name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libspatialindex-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # pyinstaller is the only new dep for the sidecar build
          python -m pip install pyinstaller
          # `test` extra (pyproject.toml) = declarative test deps (pytest, pytest-asyncio, httpx).
          # No ad-hoc `pip install pytest ...`: it drifts and leaves async tests without the plugin.
          pip install -e ".[test]"
          pip install -r requirements-api.txt

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps + build
        working-directory: web
        env:
          # Disable the PWA service worker for the Electron bundle: the SW
          # serves a cached index.html with stale asset hashes, breaking
          # full-page reloads inside the AppImage.
          VITE_PWA: 'false'
          # The portable bundle serves the frontend from the root path.
          VITE_BASE: /
          VITE_API_URL: /api/v1
        run: |
          npm ci
          npm run build

      - name: Run backend tests
        run: |
          pytest tests/ -q --tb=short -x --ignore=tests/test_openblast.py

      - name: Install electron deps
        working-directory: electron
        run: npm ci

      - name: Run electron unit tests
        working-directory: electron
        run: npm test

      - name: Build sidecar (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm conciliacion-api.spec

      - name: Verify sidecar binary
        run: |
          ls -la dist/conciliacion-api/conciliacion-api
          file dist/conciliacion-api/conciliacion-api

      - name: Smoke test sidecar
        if: hashFiles('dist/conciliacion-api/conciliacion-api') != ''
        run: |
          python -c "import socket; s=socket.socket(); s.bind(('127.0.0.1', 57890)); s.close()"
          # Start the sidecar in the background
          ./dist/conciliacion-api/conciliacion-api &
          SIDECAR_PID=$!
          trap 'kill "$SIDECAR_PID" 2>/dev/null || true; wait "$SIDECAR_PID" 2>/dev/null || true' EXIT
          # Wait for health
          healthy=false
          for i in {1..60}; do
            kill -0 "$SIDECAR_PID" 2>/dev/null || { echo "::error::Sidecar exited"; exit 1; }
            if [ "$(curl --max-time 1 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:57890/api/v1/health || true)" = 200 ]; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            echo "::error::Sidecar health timed out"
            exit 1
          fi
          # Test the API
          curl -sf http://127.0.0.1:57890/api/v1/sections -o /dev/null -w "%{http_code}\n"

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: conciliacion-api-linux
          path: dist/conciliacion-api/
          if-no-files-found: error

      - name: Build Electron AppImage
        working-directory: electron
        run: npm run build:linux

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: conciliacion-portable-linux.AppImage
          path: dist-portable/*.AppImage
          if-no-files-found: error
