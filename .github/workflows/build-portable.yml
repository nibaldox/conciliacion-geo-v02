name: Build portable bundle

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json

      - name: Install Python deps
        run: |
          pip install -r requirements-api.txt
          pip install pyinstaller

      - name: Build React
        working-directory: web
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_BASE: /
          # Disable the PWA service worker for the Electron bundle: the
          # SW's NavigationRoute serves a cached index.html with stale
          # asset hashes, which breaks full-page reloads (e.g. the
          # "Nueva sesión" button) and leaves the UI empty.
          VITE_PWA: "false"

      - name: Build Python sidecar
        run: |
          pyinstaller --clean --noconfirm conciliacion-api.spec

      - name: Smoke test sidecar (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          python -c "import socket; s=socket.socket(); s.bind(('127.0.0.1', 57890)); s.close()"
          ./dist/conciliacion-api/conciliacion-api &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            kill -0 "$pid" 2>/dev/null || { echo "::error::Sidecar exited"; exit 1; }
            if [ "$(curl --max-time 1 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:57890/api/v1/health || true)" = 200 ]; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Sidecar health timed out"
          exit 1

      - name: Smoke test sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 57890)
          try { $listener.Start() } finally { $listener.Stop() }
          $process = Start-Process -FilePath (Resolve-Path 'dist/conciliacion-api/conciliacion-api.exe') -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Sidecar exited with code $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:57890/api/v1/health' -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw 'Sidecar health timed out' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Install Electron deps
        working-directory: electron
        run: npm ci

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: electron
        run: npm run build:linux

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: electron
        run: npm run build:windows

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist-portable/win-unpacked/* `
            -DestinationPath conciliacion-portable-windows.zip

      - name: Rename Linux artifact for clarity
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist-portable/*.AppImage conciliacion-portable-linux.AppImage

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: conciliacion-portable-windows
          path: conciliacion-portable-windows.zip

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: conciliacion-portable-linux
          path: conciliacion-portable-linux.AppImage

  release:
    if: ${{ inputs.release == true }}
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get version from electron/package.json
        id: version
        run: echo "version=$(jq -r .version electron/package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: conciliacion-portable-windows
          path: release-artifacts/

      - uses: actions/download-artifact@v8
        with:
          name: conciliacion-portable-linux
          path: release-artifacts/

      - name: List artifacts
        run: ls -lh release-artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Conciliación Geotécnica v${{ steps.version.outputs.version }}
          body: |
            ## Portable bundle — Windows + Linux

            Descarga el archivo correspondiente a tu sistema operativo, descomprime y ejecuta. No requiere instalación ni permisos de administrador.

            ### Windows
            `conciliacion-portable-windows.zip`

            ### Linux
            `conciliacion-portable-linux.AppImage`

            > **Nota para Linux**: Ubuntu 24.04+ no incluye FUSE por defecto. Si el AppImage no se ejecuta directamente, extrae con `--appimage-extract` y ejecuta `./squashfs-root/conciliacion-electron`.

            ## Stack
            - **Backend**: Python 3.14, FastAPI, trimesh, scipy, PyInstaller
            - **Frontend**: React 19, TypeScript, Tailwind CSS, CesiumJS
            - **Shell**: Electron 45, electron-builder
            - **Formatos**: STL, OBJ, DXF, XLSX, DOCX
          files: release-artifacts/*
          fail_on_unmatched_files: true
