[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliacion-geotecnica"
version = "0.2.0"
description = "Herramienta para conciliación geotécnica de taludes en minería a cielo abierto"
requires-python = ">=3.10"
dependencies = [
    "trimesh",
    "fast_simplification",
    "numpy",
    "scipy",
    "shapely",
    "openpyxl",
    "streamlit",
    "plotly",
    "pandas",
    "ezdxf",
    "python-docx",
    "matplotlib",
    "openai",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "reportlab",
    "networkx",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
conciliacion = "cli:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: benchmarks that require a large voxel grid and may take several minutes",
    "regression_v2: red regression tests for the v2 blocking remediation",
    "regression_v3: red regression tests for the v3 canonical result remediation",
    "regression_v4: red regression tests for the v4 streaming remediation",
]
